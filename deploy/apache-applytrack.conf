# Apache reverse proxy for Apply Track. gunicorn listens only on 127.0.0.1:8001,
# so nothing about the app is reachable except through this virtual host.
#
# __HOST__ is replaced with your domain name by the steps in DEPLOYMENT.md.
# Certbot then clones this block for port 443; the proxy lines below carry over
# unchanged, and X-Forwarded-Proto automatically becomes "https" in the copy.
<VirtualHost *:80>
    ServerName __HOST__

    ProxyPreserveHost On

    # Tell Django which scheme the browser actually used. "set" overwrites any
    # value the client sent, so a visitor cannot pretend their request was HTTPS.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Let Let's Encrypt's validation request through instead of proxying it.
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    ErrorLog ${APACHE_LOG_DIR}/applytrack_error.log
    CustomLog ${APACHE_LOG_DIR}/applytrack_access.log combined
</VirtualHost>
